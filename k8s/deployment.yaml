apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp083-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mp083-api
  template:
    metadata:
      labels:
        app: mp083-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: g174-mp083-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mp083-api
          volumeMounts:
            - name: models
              mountPath: /service/models
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /live
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: mp083-models
